    body {

      background: linear-gradient(135deg, #667eea, #ffffff);
      color: rgb(255, 255, 255);

    /* 导航栏 */
    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(40px);
      border-radius: 30px;
    }

    nav button {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      padding: 8px 20px;
      border-radius: 30px;
      transition: 0.6s;
      font-family: inherit;
    }

    nav button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    nav button.active {
      background: white;
      color: #764ba2;
    }

    /* 页面内容区域 */
    .page {
      display: none;           /* 默认全部隐藏 */
      padding: 60px 20px;
      text-align: center;
      animation: fadeIn 0.6s;
    }

    .page.active {
      display: block;          /* 只显示激活的那个 */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 { font-size: 42px; margin-bottom: 16px; }
    p { font-size: 20px; opacity: 0.9; line-height: 1.8; }

    img {
      border-radius: 20px;
      margin-top: 30px;
      max-width: 90%;
    }
  </style>
