<!DOCTYPE html>

  <style>
    body {
      margin: 0;

<body>
  <div>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea, #d0a1ff);
      color: rgb(255, 255, 255);
      min-height: 100vh;
    }

    /* 导航栏 */
    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 30px;
    }

    nav button {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      padding: 8px 20px;
      border-radius: 30px;
      transition: 0.3s;
      font-family: inherit;
    }

    nav button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    nav button.active {
      background: white;
      color: #764ba2;
    }

    /* 页面内容区域 */
    .page {
      display: none;           /* 默认全部隐藏 */
      padding: 60px 20px;
      text-align: center;
      animation: fadeIn 0.4s;
    }

    .page.active {
      display: block;          /* 只显示激活的那个 */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 { font-size: 42px; margin-bottom: 16px; }
    p { font-size: 20px; opacity: 0.9; line-height: 1.8; }

    img {
      border-radius: 20px;
      margin-top: 30px;
      max-width: 90%;
    }
  </style>
</head>
<body>

  <!-- 导航栏 -->
  <nav>
    <button class="active" onclick="showPage('home', this)">首页</button>
    <button onclick="showPage('services', this)">服务</button>
    <button onclick="showPage('about', this)">本站</button>
    <button onclick="showPage('contact', this)">联系</button>
  </nav>

  <!-- 首页 -->

  <!-- 服务 -->
<div id="services" class="page">

    <p style="margin: 0;">NodeVideo</p >

</div>

  <!-- 本站 -->

    <p>由NH赫霞 Studio开发</p >

    <h1>其与网站</h1>
      <p>其它有关网站 Darkclub-9bab5.web.app</p >

  <!-- 联系 -->
  <div id="contact" class="page">
    <h1>剪辑师</h1>
    <p>邮箱：zhuty968@icloud.com</p >
        <img src="images2/profile pict5.jpg" width="100" style="border-radius: 70px; outline: 1px solid white;"position="absolute" top="100" left="100">
     <p>微信ID：T-S12C-Z</p >
        <img src="images2/mtiapict1.jpg" width="100" style="border-radius: 70px; outline: 1px solid white;"position="absolute" top="100" left="100">
     <p>微信ID：jun505593633</p >

        <h1>赞助商</h1>

     <p>微信ID：Robotcat08</p >
  </div>
  </div>

  <script>
    function showPage(id, btn) {
      // 1. 隐藏所有页面
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      // 2. 显示目标页面
      document.getElementById(id).classList.add('active');
      // 3. 导航栏高亮
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>

</body>
</html>
